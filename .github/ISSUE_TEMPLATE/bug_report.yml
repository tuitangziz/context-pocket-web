name: Bug report / 问题反馈
description: Tell us what went wrong using fake or public example data.
body:
  - type: input
    id: browser
    attributes:
      label: Browser and OS / 浏览器与系统
      placeholder: Edge on Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include expected and actual behavior. Do not share secrets or private code.
    validations:
      required: true
